name: MOKU Lite

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.17.0'
      - name: Create isolated build environment
        shell: pwsh
        run: |
          $ciVenv = Join-Path $env:RUNNER_TEMP 'moku-lite-ci-venv'
          python -m venv $ciVenv
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment creation failed' }
          (Join-Path $ciVenv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$ciVenv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        shell: pwsh
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix"
          if ($LASTEXITCODE -ne 0) { throw 'Build environment is not isolated' }
          python -m pip install -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
      - name: Check published source inventory
        shell: pwsh
        run: |
          @'
          import subprocess
          from pathlib import Path
          import build_manifest
          tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")) - {""}
          documentation = {
              "assets/readme/mascot.gif",
              "assets/screenshots/v1.1.1-home.jpg",
              "assets/screenshots/v1.1.1-basket.jpg",
              "assets/screenshots/v1.1.1-history.jpg",
          }
          required = set(build_manifest.build_input_files(Path.cwd())) | {".gitignore", ".gitattributes"} | documentation
          extra, missing = sorted(tracked - required), sorted(required - tracked)
          if extra or missing:
              raise SystemExit(f"Source inventory mismatch: extra={extra}, missing={missing}")
          print(f"Published source inventory verified: {len(tracked)} files")
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Source inventory failed' }
      - name: Build release package
        shell: pwsh
        run: |
          ./build-portable.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ./make-release.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw 'Release package failed' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MOKU-Lite-windows-x64
          path: release/v*.*.*/
          if-no-files-found: error
          retention-days: 7
